<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#050817" />

    <title>NYVOLT</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <main class="game-shell">
      <!-- =================================================
           TELA INICIAL
           ================================================= -->

      <section
        class="start-screen"
        id="start-screen"
        aria-labelledby="start-title"
      >
        <div class="start-screen__content">
          <header class="start-screen__header">
            <h1 class="start-screen__title" id="start-title">NYVOLT</h1>

            <button class="start-screen__play" id="start-play" type="button">
              JOGAR
            </button>
          </header>

          <!-- =============================================
               NYVOLTS
               ============================================= -->

          <section
            class="start-screen__step start-screen__step--characters"
            id="character-step"
            aria-labelledby="character-step-title"
            hidden
          >
            <h2 class="start-screen__step-title" id="character-step-title">
              ESCOLHA SUA NYVOLT
            </h2>

            <div
              class="character-grid"
              role="group"
              aria-label="Nyvolts disponíveis"
            >
              <button
                class="character-card"
                type="button"
                data-character="amarellow"
                aria-pressed="false"
              >
                <span class="character-card__name"> AMARELLOW </span>
              </button>

              <button
                class="character-card"
                type="button"
                data-character="azully"
                aria-pressed="false"
              >
                <span class="character-card__name"> AZULLY </span>
              </button>

              <button
                class="character-card"
                type="button"
                data-character="verdyka"
                aria-pressed="false"
              >
                <span class="character-card__name"> VERDYKA </span>
              </button>

              <button
                class="character-card"
                type="button"
                data-character="vermilly"
                aria-pressed="false"
              >
                <span class="character-card__name"> VERMILLY </span>
              </button>
            </div>
          </section>

          <!-- =============================================
               MODOS
               ============================================= -->

          <section
            class="start-screen__step start-screen__step--mode"
            id="mode-step"
            aria-labelledby="mode-step-title"
            hidden
          >
            <h2
              class="start-screen__step-title start-screen__step-title--mode"
              id="mode-step-title"
            >
              ESCOLHA O MODO
            </h2>

            <div class="mode-options" role="group" aria-label="Modos de jogo">
              <button
                class="mode-option"
                type="button"
                data-mode="classic"
                aria-pressed="false"
              >
                CLASSIC
              </button>

              <button
                class="mode-option"
                type="button"
                data-mode="no-wall"
                aria-pressed="false"
              >
                NO WALL
              </button>
            </div>
          </section>
        </div>
      </section>

      <!-- =================================================
           GAMEPLAY
           ================================================= -->

      <section
        class="game-stage game-stage--waiting"
        id="game-stage"
        aria-label="NYVOLT"
        aria-hidden="true"
      >
        <header class="game-hud">
          <div class="game-info" aria-label="Informações da partida">
            <div class="game-stat">
              <span class="game-stat__label"> SCORE </span>

              <strong class="game-stat__value" id="score"> 000 </strong>
            </div>

            <div class="game-mode">
              <span class="game-mode__label"> MODE </span>

              <strong class="game-mode__value" id="game-mode"> NO WALL </strong>
            </div>

            <div class="game-stat game-stat--high-score">
              <span class="game-stat__label"> HIGH SCORE </span>

              <strong class="game-stat__value" id="high-score"> 000 </strong>
            </div>
          </div>
        </header>

        <section class="game-board" aria-label="Tabuleiro da NYVOLT">
          <div class="game-board__viewport">
            <!-- ===========================================
                 IDENTIDADE
                 =========================================== -->

            <div class="game-board__brand" aria-hidden="true">
              <span class="game-board__brand-title"> NYVOLT </span>

              <span class="game-board__character-name" id="character-name">
                AZULLY
              </span>
            </div>

            <!-- ===========================================
                 COUNTDOWN
                 =========================================== -->

            <div
              class="game-countdown"
              id="game-countdown"
              aria-live="assertive"
              aria-atomic="true"
              hidden
            >
              <span class="game-countdown__value" id="game-countdown-value">
                3
              </span>
            </div>

            <!-- ===========================================
                 GAME OVER
                 =========================================== -->

            <div
              class="game-over"
              id="game-over"
              role="dialog"
              aria-modal="true"
              aria-labelledby="game-over-title"
              hidden
            >
              <div class="game-over__content">
                <h2
                  class="game-over__title"
                  id="game-over-title"
                  aria-label="Game Over"
                >
                  <span class="game-over__title-line" aria-hidden="true">
                    <span>G</span>
                    <span>A</span>
                    <span>M</span>
                    <span>E</span>
                  </span>

                  <span class="game-over__title-line" aria-hidden="true">
                    <span>O</span>
                    <span>V</span>
                    <span>E</span>
                    <span>R</span>
                  </span>
                </h2>

                <div class="game-over__actions">
                  <button
                    class="game-over__button"
                    id="game-over-replay"
                    type="button"
                  >
                    JOGAR NOVAMENTE
                  </button>

                  <button
                    class="game-over__button"
                    id="game-over-exit"
                    type="button"
                  >
                    SAIR
                  </button>
                </div>
              </div>
            </div>

            <!-- ===========================================
                 ORBE DE ENERGIA
                 =========================================== -->

            <div class="energy-orb" aria-label="Orbe de energia"></div>

            <!-- ===========================================
                 NYVOLT
                 =========================================== -->

            <div class="snake-layer" aria-label="Nyvolt"></div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
